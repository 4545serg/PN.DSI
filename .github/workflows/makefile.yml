
name: Build PROJECT NOISE DSi

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: dkp-pacman -S --needed --noconfirm nds-dev

      - name: Fetch MP3 decoder
        run: sh tools/get_deps.sh

      - name: Build
        run: make

      - name: Verify ROM
        run: test -s project_noise_dsi.nds

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-NOISE-DSI
          path: project_noise_dsi.nds
          if-no-files-found: error
